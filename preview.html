  <style>
/* ===========================================================
   SuperJon — LP de conversão (Jon Vlogs × Superbet)
   Responsiva: mobile (empilhada) + desktop (split-screen)
   Tokens conforme lp_jon_spec.md
   =========================================================== */

:root {
  /* Cores */
  --red: #FD0104;          /* Super Red — principal */
  --red-rgb: 253, 1, 4;    /* mesmo vermelho em rgb p/ glows com alpha */
  --red-deep: #d10003;     /* gradiente do hero */
  --burgundy: #540031;     /* acento secundário */
  --dark-purple: #181020;  /* fundos escuros pontuais */
  --yellow: #FFE200;       /* Generosity Yellow */
  --white: #FFFFFF;
  --ink: #1a1320;          /* texto principal */
  --ink-soft: #5c5566;     /* texto secundário */
  --ink-faint: #938b9c;    /* labels, rodapé */
  --bg-2: #fbf9f7;         /* fundo dos cards */
  --line: rgba(24, 16, 32, 0.12);
  --line-strong: rgba(24, 16, 32, 0.22);
  --yellow-text: #7a5c00;  /* texto sobre amarelo */
  --yellow-text-2: #9a7600;

  --font-hero: 'Roboto Flex', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
  --hero-style: italic; /* normal em marcas sem itálico (ex.: Betano) */
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: var(--white);
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =====================================================
   LAYOUT BASE — MOBILE (empilhado, coluna única)
   ===================================================== */
.lp {
  width: 100%;
  min-height: 100dvh;
  background: var(--white);
  display: flex;
  flex-direction: column;
}

/* ===================== Hero ===================== */
.lp-hero {
  position: relative;
  background: linear-gradient(155deg, var(--red), var(--red-deep));
  color: var(--white);
  padding: 0 20px 30px;
  padding-top: env(safe-area-inset-top, 0px);
  overflow: hidden;
}

/* brilho decorativo sutil */
.lp-hero::after {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  right: -120px;
  top: -140px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.16), transparent 70%);
  pointer-events: none;
}

.lp-hero__inner {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.lp-hero__top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
}

/* Logo Superbet — imagem oficial (vermelha → branca via filtro).
   O wordmark .lp-logo entra só se a imagem falhar (onerror). */
.lp-logo-wrap {
  display: inline-flex;
  align-items: center;
}

.lp-logo-img {
  height: 15px;
  width: auto;
  display: block;
  filter: brightness(0) invert(1);
}

.lp-logo {
  display: inline-block;
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: var(--hero-style);
  font-size: 18px;
  letter-spacing: -0.5px;
  color: var(--white);
  line-height: 1;
}

.lp-logo__dot {
  color: var(--yellow);
}

.lp-avatar {
  margin-top: 14px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 8.5px;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: 0.2px;
  flex: 0 0 auto;
}

/* Motion do Jon Vlogs — webm cortado no logo, direto sobre o vermelho.
   filter deixa branco preservando a transparência (igual à logo). */
.lp-jon-motion {
  display: block;
  height: 28px;
  width: auto;
  background: transparent;
  border: none;
  object-fit: contain;
}


/* No mobile o selo do hero some (aparece no rodapé do corpo) */
.lp-hero__foot {
  display: none;
}

.lp-hero__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: var(--hero-style);
  text-transform: uppercase;
  font-size: 26px;
  line-height: 1;
  letter-spacing: -1px;
}

.lp-hero__subtitle {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.45;
  opacity: 0.92;
  max-width: 90%;
}

/* ===================== Corpo ===================== */
/* Mobile em 3 zonas: hero (topo) / conteúdo (centro) / selo (rodapé) */
.lp-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  padding: 8px 18px 0; /* margem menor entre o hero e o conteúdo (mobile) */
}

.lp-body__inner {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 0 24px;
}

/* Barra de progresso */
.lp-progress {
  height: 3px;
  background: var(--line);
  border-radius: 99px;
  margin-bottom: 13px;
  overflow: hidden;
}

.lp-progress__fill {
  height: 100%;
  width: 0%;
  background: var(--red);
  border-radius: 99px;
  transition: width 0.32s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Label de seção */
.lp-section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--ink-faint);
  margin-bottom: 11px;
}

/* ===================== Gate (pergunta de entrada) ===================== */
.lp-gate {
  padding-top: 4px;
  animation: fadeIn 0.4s ease both;
}
.lp-gate__eyebrow {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--red);
  margin-bottom: 18px;
}
/* respiro extra entre o eyebrow e o título (acento não cola) */
.lp-gate__title { padding-top: 2px; }
.lp-gate__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: var(--hero-style);
  text-transform: uppercase;
  font-size: clamp(24px, 7vw, 34px);
  line-height: 1.02;
  letter-spacing: -1px;
  color: var(--ink);
}
.lp-gate__hl { color: var(--red); }
.lp-gate__sub {
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.45;
}
.lp-gate__opts {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}
.lp-gate__opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 16px 18px;
  background: var(--white);
  border: 1.5px solid var(--line-strong);
  border-radius: 13px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease, background 0.16s ease;
  -webkit-tap-highlight-color: transparent;
}
.lp-gate__opt-arrow {
  font-family: var(--font-hero);
  font-style: var(--hero-style);
  font-weight: 800;
  color: var(--ink-faint);
  transition: transform 0.16s ease, color 0.16s ease;
}
.lp-gate__opt:hover {
  border-color: var(--red);
  transform: translateY(-2px);
  box-shadow: 0 10px 22px -14px var(--red);
}
.lp-gate__opt:hover .lp-gate__opt-arrow {
  transform: translateX(4px);
  color: var(--red);
}
.lp-gate__opt:active { transform: translateY(0); }
/* "Sim" como opção principal (vermelha) */
.lp-gate__opt--primary {
  background: var(--red);
  border-color: var(--red);
  color: var(--white);
  box-shadow: 0 12px 24px -14px var(--red);
}
.lp-gate__opt--primary .lp-gate__opt-arrow { color: rgba(255, 255, 255, 0.8); }
.lp-gate__opt--primary:hover {
  background: var(--red-deep);
  border-color: var(--red-deep);
}
.lp-gate__opt--primary:hover .lp-gate__opt-arrow { color: var(--white); }

/* Passo-a-passo (tela "criar conta") */
.lp-steps {
  list-style: none;
  margin: 20px 0 18px; /* respiro entre o passo 3 e o botão "Criar conta agora" */
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.lp-steps li {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-soft);
}
.lp-steps__n {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--red);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: var(--hero-style);
  font-size: 12px;
}

/* Utilitários responsivos (texto que muda entre mobile/desktop) */
.u-only-desktop { display: none; }

/* Texto introdutório (telas create / form-pós-cadastro) */
.lp-intro {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.45;
  margin-bottom: 14px;
}

.lp-intro--success {
  font-weight: 700;
  padding-left: 12px;
  border-left: 3px solid var(--red);
}

/* Botão de link discreto ("Já tenho conta") */
.lp-link-btn {
  display: block;
  width: 100%;
  margin-top: 44px;
  background: none;
  border: none;
  color: var(--ink-soft);
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.lp-link-btn:hover { color: var(--ink); }

/* Inputs de texto */
.lp-input {
  width: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  background: var(--white);
  border: 1.5px solid var(--line-strong);
  border-radius: 9px;
  padding: 10px 12px;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
  -webkit-appearance: none;
  appearance: none;
}
.lp-input::placeholder { color: var(--ink-faint); font-weight: 400; }
.lp-input:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(var(--red-rgb), 0.10);
}

/* Linha de consentimento + link dos termos */
.lp-consent {
  font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.45;
  margin-top: 12px;
}
.lp-terms-link {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  color: var(--ink);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.lp-terms-link:hover { color: var(--red); }

/* Animação de erro */
.shake { animation: shake 0.35s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* Grid de perguntas (1 coluna no mobile) */
.lp-questions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
}

/* Card de pergunta */
.lp-q {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
  margin-bottom: 9px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

/* Destaque de pendência ao tentar enviar incompleto */
.lp-q.is-pending {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(var(--red-rgb), 0.10);
}

.lp-q__head {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 9px;
}

.lp-q__num {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: var(--red);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: var(--hero-style);
  font-size: 12px;
}

.lp-q__text {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
  padding-top: 3px;
}

/* Chips */
.lp-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  background: var(--white);
  border: 1.5px solid var(--line-strong);
  border-radius: 9px;
  padding: 7px 11px;
  cursor: pointer;
  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}

.chip:hover {
  border-color: var(--ink-soft);
}

.chip:active {
  transform: scale(0.97);
}

.chip:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}

/* Selecionado — vermelho (padrão) */
.chip.is-selected {
  background: var(--red);
  border-color: var(--red);
  color: var(--white);
}

/* Selecionado — amarelo (ex.: "Os dois") */
.chip.is-selected.chip--yellow {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--yellow-text);
}

/* Botão CTA (serve para <button> e <a>) */
.lp-cta {
  display: block;
  width: 100%;
  margin-top: 14px;
  background: var(--red);
  color: var(--white);
  font-family: var(--font-cta, var(--font-hero));
  font-weight: var(--cta-weight, 800);
  font-style: var(--hero-style);
  text-transform: uppercase;
  font-size: 14px;
  letter-spacing: 0.3px;
  line-height: 1;
  text-align: center;
  text-decoration: none;
  border: none;
  padding: 13px;
  border-radius: 11px;
  box-shadow: 0 12px 24px -12px var(--red);
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.lp-cta:hover {
  box-shadow: 0 14px 28px -10px var(--red);
}

.lp-cta:active {
  transform: translateY(1px) scale(0.995);
}

.lp-cta:disabled {
  cursor: not-allowed;
}

.lp-cta.is-loading {
  opacity: 0.75;
  pointer-events: none;
}

/* CTA com motion — pulso contínuo p/ atrair o clique.
   O brilho (shine) só varre quando o cursor passa por cima. */
.lp-cta--pulse {
  position: relative;
  overflow: hidden;
  animation: ctaPulse 1.9s ease-in-out infinite;
}
/* brilho (shine) — escondido; só varre no hover */
.lp-cta--pulse::after {
  content: "";
  position: absolute;
  top: 0;
  left: -65%;
  width: 45%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  transform: skewX(-20deg);
  opacity: 0;
  pointer-events: none;
}
.lp-cta--pulse:hover::after {
  opacity: 1;
  animation: ctaShine 1s ease-out;
}
@keyframes ctaPulse {
  0%, 100% {
    box-shadow: 0 12px 24px -12px var(--red);
    transform: translateY(0) scale(1);
  }
  50% {
    box-shadow: 0 18px 36px -10px var(--red), 0 0 0 5px rgba(var(--red-rgb), 0.16);
    transform: translateY(-2px) scale(1.015);
  }
}
@keyframes ctaShine {
  0% { left: -65%; }
  100% { left: 150%; }
}

/* CTA final (entrar no grupo) — borda iluminada girando + flutua no hover.
   Distinto do botão de cadastro (que pulsa/respira). */
.lp-cta--go {
  position: relative;
  z-index: 0;
  overflow: hidden;
}
.lp-cta--go::before {           /* glow que percorre TODA a borda, uniforme */
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, rgba(255, 255, 255, 0.4) 35%, transparent 65%);
  offset-path: border-box;      /* segue o contorno do botão */
  offset-anchor: 50% 50%;
  offset-distance: 0%;
  animation: ctaTravel 3.8s linear infinite;
  z-index: 0;
  pointer-events: none;
}
.lp-cta--go::after {            /* preenchimento interno: deixa só a borda acesa */
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 9px;
  background: var(--red);
  z-index: 1;
}
.lp-cta--go .lp-cta__label {    /* texto acima da borda animada */
  position: relative;
  z-index: 2;
}
.lp-cta--go:hover {             /* flutua ao passar o cursor */
  transform: translateY(-3px);
  box-shadow: 0 18px 34px -10px var(--red);
}
@keyframes ctaTravel { to { offset-distance: 100%; } }

/* Fallback: navegadores sem offset-path -> cônico girando (menos uniforme) */
@supports not (offset-path: border-box) {
  .lp-cta--go::before {
    width: auto;
    height: auto;
    inset: -60%;
    border-radius: 0;
    background: conic-gradient(from 0deg, transparent 0 290deg, #fff 330deg, transparent 360deg);
    animation: ctaBeam 3.6s linear infinite;
  }
  @keyframes ctaBeam { to { transform: rotate(360deg); } }
}

/* Rodapé de responsabilidade — selo +18 + texto, fixo no fim da página */
.lp-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 9.5px;
  color: var(--ink-faint);
  padding: 14px 0 18px;
  margin-top: 12px;
  border-top: 1px solid var(--line);
  line-height: 1.45;
  text-align: left;
}

/* Selo +18 — círculo (trocar por SEAL_URL oficial). "18+" centralizado. */
.lp-seal {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 9.5px;
  letter-spacing: 0;
}
.lp-seal-img {
  flex: 0 0 auto;
  height: 30px;
  width: auto;
  display: block;
}

/* ===================== Tela de confirmação ===================== */
.lp-done {
  text-align: center;
  padding: 40px 24px 48px;
  animation: fadeIn 0.4s ease both;
}

.lp-done__check {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--red);
  color: var(--white);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 16px;
}

.lp-done__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: var(--hero-style);
  text-transform: uppercase;
  font-size: 22px;
  letter-spacing: -0.5px;
  line-height: 1.05;
  color: var(--ink);
  margin-bottom: 10px;
}

.lp-done__text {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
  max-width: 280px;
  margin: 0 auto 20px;
}

.lp-done__badge {
  display: inline-block;
  background: var(--yellow);
  color: var(--yellow-text);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;

   ===================================================== */
@media (min-width: 880px) {
  .lp {
    flex-direction: row;
    align-items: stretch;
  }

  /* alterna o texto direcional do subtítulo (abaixo -> ao lado) */
  .u-only-mobile { display: none; }
  .u-only-desktop { display: inline; }

  /* Hero vira painel esquerdo fixo, tela cheia.
     Largura amarrada à altura na proporção da arte (3:4 = 0.775), pra a
     imagem em cover preencher SEM cortar e sem margem. min() limita em telas
     muito altas pra o formulário manter espaço. */
  .lp-hero {
    flex: 0 0 auto;
    width: min(52%, calc(100dvh * 0.775));
    padding: 44px 56px 48px;
    display: flex;
    align-items: stretch;
    position: sticky;
    top: 0;
    height: 100dvh;
  }

  .lp-hero::after {
    width: 520px;
    height: 520px;
    right: -160px;
    top: 50%;
    transform: translateY(-50%);
  }

    max-width: 100%;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }

    margin-bottom: 0;

    margin-top: 0;

    align-items: center;
    justify-content: center;
    padding: 56px 48px;
    min-height: 100dvh;

  .lp-body__inner {
    max-width: 620px;
  }

  .lp-section-label {
    font-size: 11px;
    margin-bottom: 16px;

  .lp-questions {
    grid-template-columns: 1fr 1fr;

    padding: 8px 13px;
  }

  .lp-cta {

    padding: 16px;

  }

  .lp-foot {
    display: none;
  }

  .lp-done {
    grid-column: 1 / -1;

  .lp-done__text { font-size: 15px; max-width: 360px; }

  }

@media (prefers-reduced-motion: reduce) {

    transition-duration: 0.001ms !important;
  }

/* ===========================================================
   Influenciador no hero — a imagem PREENCHE o painel (cover); a logo
   e o selo +18 ficam POR CIMA. As imagens (hero.creatorPhoto = desktop,
   hero.creatorBanner = mobile) são filhas diretas de .lp-hero, como fundo.
   Sem imagem, o engine oculta o <img> via inline style.
   =========================================================== */
.lp-hero__photo,
.lp-hero__banner {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  z-index: 0;
  display: none;                 /* cada breakpoint mostra a sua */
}
.lp-hero__scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  display: none;
}
.lp-hero__inner { z-index: 2; }  /* logo/selo por cima da imagem e do scrim */
.lp-hero::after { display: none; } /* a imagem é o fundo: sem o glow decorativo */

/* ---------------- MOBILE: banner preenche o header (16:10) ---------------- */
@media (max-width: 879px) {
  .lp-hero { min-height: 62.5vw; }       /* 100/1.6 -> proporção 16:10 */
  .lp-hero__banner { display: block; }   /* fundo do header */
  .lp-hero__scrim {
    display: block;
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.5), transparent 30%, transparent 74%, rgba(0, 0, 0, 0.32));
  }

  /* "Seus dados" some no mobile (otimiza espaço) */
  .lp-section-label { display: none; }

  /* Fluxo direto: header menor + form compacto p/ caber numa tela só */
  [data-flow="direct"] .lp-hero { min-height: 52vw; }
  [data-flow="direct"] .lp-body { padding-top: 10px; }
  [data-flow="direct"] .lp-body__inner { justify-content: flex-start; padding: 6px 0 14px; }
  [data-flow="direct"] .lp-q { padding: 8px 11px; margin-bottom: 7px; }
  [data-flow="direct"] .lp-q__head { margin-bottom: 7px; }
  [data-flow="direct"] .lp-q__num { width: 21px; height: 21px; font-size: 11px; }
  [data-flow="direct"] .lp-input { padding: 8px 11px; }
  [data-flow="direct"] .lp-chips { gap: 5px; }
  [data-flow="direct"] .chip { padding: 6px 10px; font-size: 11px; }
  [data-flow="direct"] .lp-noacc { margin-top: 10px; padding: 10px 13px; }
  [data-flow="direct"] .lp-consent { margin-top: 8px; font-size: 10px; }
  [data-flow="direct"] .lp-cta { margin-top: 10px; padding: 12px; }
}

/* ---------------- DESKTOP: foto preenche o painel (3:4) ---------------- */
@media (min-width: 880px) {
  .lp-hero__photo { display: block; }
  .lp-hero__scrim {
    display: block;
    background: linear-gradient(180deg,
      rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.12) 20%,
      transparent 46%, transparent 58%, rgba(0, 0, 0, 0.62) 100%);

  .lp-hero__foot { margin-top: auto; }   /* selo na base, por cima da imagem */

  .lp-gate__opt { padding: 20px 22px; font-size: 17px; border-radius: 15px; }
  .lp-cta { font-size: 17px; padding: 18px; }
}

  <script>
/* ===========================================================
   LP Engine — núcleo genérico (multi-marca)
   Lê a config da marca em window.BRAND (brands/<marca>/config.js).
   Fluxo: gate -> (create) -> form -> submitLead(Supabase) -> grupo.
   =========================================================== */
(function () {
  'use strict';

  var B = window.BRAND;
  if (!B) { console.error('[engine] window.BRAND não definido.'); return; }

  /* ----------------------- Helpers ----------------------- */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function cardShell(num, labelText) {
    var card = el('div', 'lp-q');
    var head = el('div', 'lp-q__head');
    if (num != null) head.appendChild(el('span', 'lp-q__num', String(num)));
    head.appendChild(el('span', 'lp-q__text', labelText));
    card.appendChild(head);
    return card;
  }

  function getTracking() {
    var params = new URLSearchParams(window.location.search);
    var utm = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
      utm[k] = params.get(k) || '';
    });
    return utm;
  }

  /* ----------------------- Estado ----------------------- */
  function uuid() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'lp-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }
  // client_id PERSISTENTE por creator: quem volta no mesmo navegador mantém o
  // mesmo id, então o recebedor casa a reentrada na mesma linha (não duplica).
  function persistentClientId() {
    var key = 'lp_cid_' + (B.creator || 'x');
    try {
      var v = localStorage.getItem(key);
      if (!v) { v = uuid(); localStorage.setItem(key, v); }
      return v;
    } catch (e) { return uuid(); } // localStorage indisponível: id de sessão
  }
  var state = { hasAccount: null, data: {}, bet: null, clientId: persistentClientId(), partialSent: false, regEventSent: false };
  var FIELDS = B.form.fields;
  var BET = B.form.bet;
  var screenEl = document.getElementById('screen');

  /* ===========================================================
     Branding: tokens, meta e hero (a partir da config)
     =========================================================== */
  function applyBranding() {
    document.documentElement.setAttribute('data-flow', B.flow || 'full');
    if (B.meta) {
      if (B.meta.title) document.title = B.meta.title;
      setMeta('name', 'description', B.meta.description);
      setMeta('name', 'theme-color', B.meta.themeColor);
    }
    if (B.tokens) {
      var root = document.documentElement;
      Object.keys(B.tokens).forEach(function (k) { root.style.setProperty(k, B.tokens[k]); });
    }
    renderHero();
  }

  function setMeta(attr, key, val) {
    if (!val) return;
    var m = document.querySelector('meta[' + attr + '="' + key + '"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m); }
    m.setAttribute('content', val);
  }

  function renderHero() {
    var h = B.hero || {};
    var logo = document.querySelector('.lp-logo-img');
    var word = document.querySelector('.lp-logo');
    var showWordmark = function () {
      if (logo) logo.style.display = 'none';
      if (word) {
        word.innerHTML = (h.brandWordmark || '') + '<span class="lp-logo__dot">.</span>';
        word.style.display = 'inline-block';
      }
    };
    if (logo) {
      if (!h.brandLogo) {
        showWordmark();              // marca sem imagem de logo -> wordmark
      } else {
        logo.src = h.brandLogo;
        logo.alt = h.brandWordmark || '';
        if (h.brandLogoWhite === false) logo.style.filter = 'none';
        logo.onerror = showWordmark; // se a imagem falhar -> wordmark
      }
    }
    var jon = document.querySelector('.lp-jon-motion');
    if (jon) {
      if (h.creatorLogo) { jon.src = h.creatorLogo; jon.alt = h.creatorAlt || ''; }
      else { jon.style.display = 'none'; }   // sem logo do criador -> não mostra img quebrada
    }

    // Influenciador: foto vertical (desktop) e banner horizontal (mobile).
    // Cada um é exibido/ocultado por breakpoint no CSS da marca.
    setHeroImg('.lp-hero__photo', h.creatorPhoto, h.creatorPhotoAlt);
    setHeroImg('.lp-hero__banner', h.creatorBanner, h.creatorPhotoAlt);

    var hfText = document.querySelector('.lp-hero__foot-text');
    if (hfText && B.seal) hfText.textContent = B.seal.text;
  }

  // define src/alt de uma imagem do influenciador; oculta se não houver src
  function setHeroImg(sel, src, alt) {
    var img = document.querySelector(sel);
    if (!img) return;
    if (src) { img.src = src; img.alt = alt || ''; }
    else { img.style.display = 'none'; }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ===========================================================
     TELA: gate
     =========================================================== */
  // marca a tela atual no <html> (data-screen) p/ o CSS reagir (ex.: banner
  // do influenciador só na tela do gate no mobile)
  function setScreen(name) {
    document.documentElement.setAttribute('data-screen', name);
  }

  function renderGate() {
    setScreen('gate');
    screenEl.innerHTML = '';
    state.hasAccount = null;
    var g = B.gate;

    var gate = el('div', 'lp-gate');
    gate.appendChild(el('span', 'lp-gate__eyebrow', g.eyebrow));
    var title = el('h2', 'lp-gate__title');
    title.innerHTML = g.questionHTML;
    gate.appendChild(title);
    gate.appendChild(el('p', 'lp-gate__sub', g.sub));

    var opts = el('div', 'lp-gate__opts');
    [['sim', g.yes, 'lp-gate__opt--primary'], ['nao', g.no, '']].forEach(function (item) {
      var btn = el('button', 'lp-gate__opt ' + item[2]);
      btn.type = 'button';
      btn.appendChild(el('span', 'lp-gate__opt-label', item[1]));
      btn.appendChild(el('span', 'lp-gate__opt-arrow', '→'));
      btn.addEventListener('click', function () {
        if (item[0] === 'sim') { state.hasAccount = 'sim'; renderForm(false); }
        else { renderCreate(); }
      });
      opts.appendChild(btn);
    });
    gate.appendChild(opts);
    screenEl.appendChild(gate);
  }

  /* ===========================================================
     TELA: create
     =========================================================== */
  function renderCreate() {
    setScreen('create');
    screenEl.innerHTML = '';
    var c = B.create;

    var wrap = el('div', 'lp-gate');
    wrap.appendChild(el('span', 'lp-gate__eyebrow', c.eyebrow));
    var title = el('h2', 'lp-gate__title');
    title.innerHTML = c.titleHTML;
    wrap.appendChild(title);
    wrap.appendChild(el('p', 'lp-gate__sub', c.sub));

    var steps = document.createElement('ol');
    steps.className = 'lp-steps';
    (c.steps || []).forEach(function (txt, i) {
      var li = document.createElement('li');
      li.appendChild(el('span', 'lp-steps__n', String(i + 1)));
      li.appendChild(el('span', null, txt));
      steps.appendChild(li);
    });
    wrap.appendChild(steps);

    // Link real -> NOVA aba garantida (PC, mobile, in-app)
    var reg = (B.links && B.links.registration) || '';
    var btn = el('a', 'lp-cta lp-cta--pulse', c.cta);
    btn.href = reg || '#';
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.setAttribute('role', 'button');
    btn.addEventListener('click', function (e) {
      if (!reg) { e.preventDefault(); console.warn('[create] links.registration não configurado.'); }
      state.hasAccount = 'criou_agora';
      setTimeout(function () { renderForm(true); }, 80);
    });
    wrap.appendChild(btn);

    var back = el('button', 'lp-link-btn', c.back);
    back.type = 'button';
    back.addEventListener('click', function () { state.hasAccount = 'sim'; renderForm(false); });
    wrap.appendChild(back);

    screenEl.appendChild(wrap);
  }

  /* ===========================================================
     TELA: form
     =========================================================== */
  function renderForm(fromCreate) {
    setScreen('form');
    screenEl.innerHTML = '';
    var F = B.form;

    if (fromCreate) {
      screenEl.appendChild(el('p', 'lp-intro lp-intro--success', F.successIntro));
    } else {
      screenEl.appendChild(el('p', 'lp-section-label', F.sectionLabel));
    }

    var form = el('form', 'lp-form');
    form.noValidate = true;
    var n = 1;

    function fieldCard(f) {
      var card = cardShell(n++, f.label);
      var input = el('input', 'lp-input');
      input.type = f.type;
      input.name = f.id;
      input.placeholder = f.placeholder || '';
      if (f.autocomplete) input.autocomplete = f.autocomplete;
      if (f.inputmode) input.setAttribute('inputmode', f.inputmode);
      input.value = state.data[f.id] || '';
      input.addEventListener('input', function () {
        state.data[f.id] = input.value;
        card.classList.remove('is-pending');
      });
      card.appendChild(input);
      card.dataset.field = f.id;
      return card;
    }

    function betCardEl() {
      var betCard = cardShell(n++, BET.label);
      betCard.dataset.field = BET.id;
      var chips = el('div', 'lp-chips');
      BET.options.forEach(function (opt) {
        var chip = el('button', 'chip', opt.label);
        chip.type = 'button';
        if (state.bet === opt.value) chip.classList.add('is-selected');
        chip.addEventListener('click', function () {
          state.bet = opt.value;
          chips.querySelectorAll('.chip').forEach(function (cc) { cc.classList.remove('is-selected'); });
          chip.classList.add('is-selected');
          betCard.classList.remove('is-pending');
        });
        chips.appendChild(chip);
      });
      betCard.appendChild(chips);
      return betCard;
    }

    // "Não possui cadastro?" (fluxo direto): callout em destaque -> pop-up + early-save
    function noAccEl() {
      var D = B.direct || {};
      var na = el('label', 'lp-noacc');
      var cb = el('input', 'lp-noacc__cb');
      cb.type = 'checkbox';
      na.appendChild(cb);
      na.appendChild(el('span', 'lp-noacc__q', D.noAccountLabel || 'Não possui cadastro?'));
      cb.addEventListener('change', function () {
        if (cb.checked) { state.hasAccount = 'nao'; sendPartial(); openReg(); }
        else { state.hasAccount = 'sim'; }
      });
      return na;
    }

    // ordem dos itens. Padrão: campos + faixa no fim. A variante direta
    // reordena via F.order (ex.: e-mail/ID depois da faixa de aposta).
    var order = (F.order && F.order.length) ? F.order
      : FIELDS.map(function (f) { return f.id; }).concat(['bet']);
    order.forEach(function (id) {
      if (id === 'bet') {
        form.appendChild(betCardEl());
      } else {
        var f = FIELDS.filter(function (x) { return x.id === id; })[0];
        if (f) form.appendChild(fieldCard(f));
      }
    });

    // Fluxo direto: "Não possui cadastro?" depois de todos os tópicos
    if (B.flow === 'direct') form.appendChild(noAccEl());

    var consent = el('p', 'lp-consent');
    consent.appendChild(document.createTextNode(F.consentText));
    var termsLink = el('button', 'lp-terms-link', F.termsLink);
    termsLink.type = 'button';
    termsLink.addEventListener('click', openTerms);
    consent.appendChild(termsLink);
    consent.appendChild(document.createTextNode('.'));
    form.appendChild(consent);

    var cta = el('button', 'lp-cta lp-cta--go');
    cta.type = 'submit';
    cta.appendChild(el('span', 'lp-cta__label', F.cta));
    form.appendChild(cta);

    form.addEventListener('submit', function (e) { e.preventDefault(); handleSubmit(cta); });

    screenEl.appendChild(form);
  }

  /* ----------------------- Validação ----------------------- */
  function requiredIds() {
    return FIELDS.map(function (f) { return f.id; }).concat([BET.id]);
  }
  function validateField(id) {
    var v = (state.data[id] || '').trim();
    if (id === BET.id) return state.bet != null;
    if (!v) return false;
    if (id === 'contato') {
      var isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      return isEmail || v.length >= 3;
    }
    if (id === 'telefone') return v.replace(/\D/g, '').length >= 10;
    return v.length >= 2;
  }
  function highlightInvalid() {
    var first = null;
    requiredIds().forEach(function (id) {
      var card = screenEl.querySelector('[data-field="' + id + '"]');
      if (!card) return;
      if (!validateField(id)) { card.classList.add('is-pending'); if (!first) first = card; }
      else card.classList.remove('is-pending');
    });
    if (first) {
      first.classList.add('shake');
      setTimeout(function () { first.classList.remove('shake'); }, 400);
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var inp = first.querySelector('input');
      if (inp) inp.focus({ preventScroll: true });
    }
  }

  /* ----------------------- Payload (linha do banco) ----------------------- */
  function betMeta(value) {
    return BET.options.filter(function (x) { return x.value === value; })[0] || {};
  }

  // Dispara o evento de conversão no Meta Pixel — SÓ p/ a faixa marcada com
  // `track: true` na config (ex.: R$ 5.000+). No-op se o Pixel não carregou
  // (id vazio) ou se a faixa selecionada não é a rastreada.
  function trackPixelConversion() {
    var opt = betMeta(state.bet);
    if (!opt || !opt.track) return;
    if (typeof window.fbq !== 'function') return;
    var evt = (B.pixel && B.pixel.event) || 'CriarConta5000';
    try {
      window.fbq('trackCustom', evt, {
        creator: B.creator,
        source: B.source,
        faixa_aposta: state.bet
      });
    } catch (e) { /* pixel indisponível: nunca bloqueia o fluxo */ }
  }

  // Evento PADRÃO "CompleteRegistration" do Meta — dispara quando o lead
  // completa e envia o formulário da LP. Vale p/ todas as marcas e fluxos,
  // SEM trava de faixa (independente do valor escolhido). Independente do
  // CriarConta5000. No-op se o Pixel não carregou (id vazio).
  function trackCompleteRegistration() {
    if (state.regEventSent) return;              // dispara no máx. 1x por sessão
    if (typeof window.fbq !== 'function') return;
    state.regEventSent = true;
    try {
      window.fbq('track', 'CompleteRegistration', {
        creator: B.creator,
        source: B.source,
        flow: B.flow || 'full',
        faixa_aposta: state.bet
      });
    } catch (e) { /* pixel indisponível: nunca bloqueia o fluxo */ }
  }

  function buildRow(opts) {
    opts = opts || {};
    var utm = getTracking();
    var bm = betMeta(state.bet);
    var jtc = state.hasAccount === 'sim' ? 'sim'
      : (state.hasAccount === 'nao' ? 'nao' : 'criou_agora');
    var row = {
      creator: B.creator,
      source: B.source,
      flow: B.flow || 'full',
      client_id: state.clientId,
      status: opts.partial ? 'parcial' : 'completo',
      faixa_aposta: state.bet,
      faixa_aposta_label: bm.label || '',
      ja_tinha_conta: jtc,
      consentimento: !opts.partial,
      utm_source: utm.utm_source,
      utm_medium: utm.utm_medium,
      utm_campaign: utm.utm_campaign,
      utm_content: utm.utm_content,
      utm_term: utm.utm_term,
      referrer: document.referrer || '',
      landing_url: window.location.href,
      user_agent: navigator.userAgent
    };
    FIELDS.forEach(function (f) { row[f.id] = (state.data[f.id] || '').trim(); });
    return row;
  }

  /* ----------------------- Submit -> Supabase (robusto) ----------------------- */
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function leadEndpoint() {
    var sb = B.supabase || {};
    if (!sb.url || !sb.anonKey) return null;
    return {
      url: sb.url.replace(/\/+$/, '') + '/rest/v1/' + (sb.table || 'lp_leads'),
      key: sb.anonKey
    };
  }

  // Espelha o lead numa planilha do Google (Apps Script Web App) — destino que
  // o time controla, além do Supabase. Best-effort: sendBeacon sobrevive ao
  // redirect pro WhatsApp e não trava a conversão. No-op se B.sheet.url vazio.
  function postToSheet(row) {
    var url = B.sheet && B.sheet.url;
    if (!url) return;
    try {
      var body = JSON.stringify(row);
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
      } else {
        fetch(url, {
          method: 'POST', mode: 'no-cors', keepalive: true,
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: body
        });
      }
    } catch (e) { /* best-effort: nunca bloqueia o fluxo */ }
  }

  // 1 POST. keepalive=true deixa o insert completar mesmo durante o redirect
  // pro WhatsApp (senão a navegação cancela a requisição).
  async function postLead(row) {
    var ep = leadEndpoint();
    if (!ep) { console.log('[submitLead] (Supabase não configurado) row:', row); await wait(120); return; }
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var to = ctrl ? setTimeout(function () { ctrl.abort(); }, 6000) : null;
    try {
      var res = await fetch(ep.url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': ep.key,
          'Authorization': 'Bearer ' + ep.key,
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify(row),
        keepalive: true,
        signal: ctrl ? ctrl.signal : undefined
      });
      if (!res.ok) throw new Error('Supabase insert ' + res.status + ': ' + (await res.text()));
    } finally { if (to) clearTimeout(to); }
  }

  // tenta com backoff (rede instável / pico de tráfego)
  async function submitLead(row) {
    var delays = [0, 700, 1800];
    var lastErr;
    for (var i = 0; i < delays.length; i++) {
      if (delays[i]) await wait(delays[i]);
      try { await postLead(row); return; }
      catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  // Fila local (à prova de falha): se o banco falhar mesmo após os retries,
  // o lead não se perde — fica salvo e é reenviado na próxima visita.
  var QUEUE_KEY = 'lp_lead_queue';
  function queueLead(row) {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      q.push(row);
      if (q.length > 80) q = q.slice(-80);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
    } catch (e) { /* localStorage indisponível: ok, segue */ }
  }
  function flushQueue() {
    if (!leadEndpoint()) return;
    var q;
    try { q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return; }
    if (!q.length) return;
    var remaining = [];
    (function next(i) {
      if (i >= q.length) {
        try { localStorage.setItem(QUEUE_KEY, JSON.stringify(remaining)); } catch (e) {}
        return;
      }
      postLead(q[i]).then(function () { next(i + 1); })
        .catch(function () { remaining.push(q[i]); next(i + 1); });
    })(0);
  }

  // Salva o lead PARCIAL (fluxo direto): dispara quando a pessoa marca
  // "Não possui cadastro?" — captura o que já preencheu antes de sair pro
  // cadastro (pode não voltar). Mesmo client_id do envio final p/ casar depois.
  function sendPartial() {
    if (state.partialSent) return;
    state.partialSent = true;
    var row = buildRow({ partial: true });
    postToSheet(row); // espelha na planilha do time
    try {
      submitLead(row).catch(function (err) {
        console.warn('[sendPartial] falhou — enfileirando:', err);
        queueLead(row);
      });
    } catch (e) { console.warn('[sendPartial] erro:', e); queueLead(row); }
  }

  function handleSubmit(cta) {
    if (!requiredIds().every(validateField)) { highlightInvalid(); return; }
    trackCompleteRegistration(); // Meta Pixel: lead completou o form (sem trava de faixa)
    var row = buildRow();
    postToSheet(row); // espelha na planilha do time
    var lbl = cta.querySelector('.lp-cta__label') || cta;
    cta.classList.add('is-loading');
    cta.disabled = true;
    lbl.textContent = 'Enviando...';
    var moved = false;
    function go() { if (moved) return; moved = true; goToGroup(row); }
    submitLead(row)
      .then(go)
      .catch(function (err) {
        // não perde o lead (fila local) e não trava a conversão (segue pro grupo)
        console.error('[submitLead] erro após retries — enfileirando:', err);
        queueLead(row);
        go();
      });
    // Trava de segurança: NUNCA deixa o usuário preso em "Enviando...".
    // O insert continua em background (keepalive) e fica na fila como backup.
    setTimeout(function () { if (!moved) { queueLead(row); go(); } }, 4000);
  }

  function goToGroup(row) {
    var L = B.links || {};
    var url = L.whatsapp || '';
    // Sempre renderiza a tela final (com botão) — assim o usuário nunca trava
    // em "Enviando..." mesmo se o redirect automático demorar/for bloqueado.
    renderDone(row, url);
    if (url) { try { window.location.assign(url); } catch (e) {} }
  }

  /* ----------------------- TELA: done ----------------------- */
  function renderDone(row, url) {
    setScreen('done');
    screenEl.innerHTML = '';
    var d = B.done;
    var box = el('div', 'lp-done');
    box.appendChild(el('div', 'lp-done__check', '✓'));
    box.appendChild(el('h2', 'lp-done__title', d.title));
    box.appendChild(el('p', 'lp-done__text', d.text));
    if (url) {
      var goBtn = el('a', 'lp-cta lp-done__cta', (d && d.cta) || 'Entrar no grupo');
      goBtn.href = url;
      goBtn.rel = 'noopener noreferrer';
      box.appendChild(goBtn);
    }
    screenEl.appendChild(box);
  }

  /* ----------------------- Rodapé / selo ----------------------- */
  function renderFooter() {
    var foot = document.getElementById('lpFoot');
    if (!foot) return;
    foot.innerHTML = '';
    foot.appendChild(buildSeal());
    foot.appendChild(el('span', null, B.seal.text));
  }
  function buildSeal() {
    if (B.seal && B.seal.imageUrl) {
      var img = el('img', 'lp-seal-img');
      img.src = B.seal.imageUrl;
      img.alt = (B.seal.age || '18+') + ' Jogue com responsabilidade';
      return img;
    }
    return el('span', 'lp-seal', (B.seal && B.seal.age) || '18+');
  }
  function paintHeroSeal() {
    document.querySelectorAll('[data-seal]').forEach(function (node) { node.replaceWith(buildSeal()); });
  }

  /* ----------------------- Modal de Termos ----------------------- */
  var modal = document.getElementById('termsModal');
  var termsBody = document.getElementById('termsBody');
  function openTerms() {
    termsBody.innerHTML = '';
    (B.terms || []).forEach(function (p) { termsBody.appendChild(el('p', null, p)); });
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeTerms() { modal.hidden = true; document.body.style.overflow = ''; }
  if (modal) {
    modal.addEventListener('click', function (e) { if (e.target.hasAttribute('data-close')) closeTerms(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) closeTerms(); });
  }

  /* ----------------------- Pop-up de cadastro (fluxo direto) ----------------------- */
  var regModal = document.getElementById('regModal');
  function openReg() {
    if (!regModal) return;
    var D = (B.direct && B.direct.popup) || {};
    var reg = (B.links && B.links.registration) || '';
    var t = regModal.querySelector('#regTitle');
    var x = regModal.querySelector('#regText');
    var cta = regModal.querySelector('#regCta');
    if (t) t.textContent = D.title || 'Crie sua conta';
    if (x) x.textContent = D.text || '';
    if (cta) {
      cta.textContent = D.cta || 'Clique aqui e se cadastre';
      cta.href = reg || '#';
      cta.onclick = function (e) {
        if (!reg) { e.preventDefault(); console.warn('[reg] links.registration não configurado.'); }
        trackCompleteRegistration(); // Meta Pixel: também conta como registro completo (sem trava de faixa)
        trackPixelConversion(); // Meta Pixel: só dispara p/ a faixa 5.000+ (track:true)
        sendPartial(); // garante o early-save mesmo se o change não disparou
      };
    }
    regModal.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeReg() {
    if (regModal) { regModal.hidden = true; document.body.style.overflow = ''; }
    // fechar o pop-up volta a checkbox p/ desmarcada (ela é só o gatilho)
    var cb = document.querySelector('.lp-noacc__cb');
    if (cb) cb.checked = false;
    state.hasAccount = 'sim';
  }
  if (regModal) {
    regModal.addEventListener('click', function (e) { if (e.target.hasAttribute('data-close')) closeReg(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !regModal.hidden) closeReg(); });
  }

  /* ----------------------- Init ----------------------- */
  applyBranding();
  paintHeroSeal();
  renderFooter();
  flushQueue(); // reenvia leads que ficaram pendentes em visitas anteriores
  if (B.flow === 'direct') { state.hasAccount = 'sim'; renderForm(false); }
  else renderGate();
})();

</script>
</body>
</html>
