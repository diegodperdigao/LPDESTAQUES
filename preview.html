<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FD0104" />
  <title>SuperJon — Entre no grupo</title>
  <meta name="description" content="Responda as perguntas rápidas e a equipe te direciona pro grupo. Conteúdo para maiores de 18 anos." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:ital,opsz,wght@0,8..144,400..900;1,8..144,600..900&display=swap"
    rel="stylesheet"
  />

  <style>
/* ===========================================================
   SuperJon — LP de conversão (Jon Vlogs × Superbet)
   Responsiva: mobile (empilhada) + desktop (split-screen)
   Tokens conforme lp_jon_spec.md
   =========================================================== */

:root {
  /* Cores */
  --red: #FD0104;          /* Super Red — principal */
  --red-deep: #d10003;     /* gradiente do hero */
  --burgundy: #540031;     /* acento secundário */
  --dark-purple: #181020;  /* fundos escuros pontuais */
  --yellow: #FFE200;       /* Generosity Yellow */
  --white: #FFFFFF;
  --ink: #1a1320;          /* texto principal */
  --ink-soft: #5c5566;     /* texto secundário */
  --ink-faint: #938b9c;    /* labels, rodapé */
  --bg-2: #fbf9f7;         /* fundo dos cards */
  --line: rgba(24, 16, 32, 0.12);
  --line-strong: rgba(24, 16, 32, 0.22);
  --yellow-text: #7a5c00;  /* texto sobre amarelo */
  --yellow-text-2: #9a7600;

  --font-hero: 'Roboto Flex', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  background: var(--white);
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* =====================================================
   LAYOUT BASE — MOBILE (empilhado, coluna única)
   ===================================================== */
.lp {
  width: 100%;
  min-height: 100dvh;
  background: var(--white);
  display: flex;
  flex-direction: column;
}

/* ===================== Hero ===================== */
.lp-hero {
  position: relative;
  background: linear-gradient(155deg, var(--red), var(--red-deep));
  color: var(--white);
  padding: 0 20px 30px;
  padding-top: env(safe-area-inset-top, 0px);
  overflow: hidden;
}

/* brilho decorativo sutil */
.lp-hero::after {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  right: -120px;
  top: -140px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.16), transparent 70%);
  pointer-events: none;
}

.lp-hero__inner {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
}

.lp-hero__top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
}

/* Logo Superbet — imagem oficial (vermelha → branca via filtro).
   O wordmark .lp-logo entra só se a imagem falhar (onerror). */
.lp-logo-wrap {
  display: inline-flex;
  align-items: center;
}

.lp-logo-img {
  height: 15px;
  width: auto;
  display: block;
  filter: brightness(0) invert(1);
}

.lp-logo {
  display: inline-block;
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  font-size: 18px;
  letter-spacing: -0.5px;
  color: var(--white);
  line-height: 1;
}

.lp-logo__dot {
  color: var(--yellow);
}

.lp-avatar {
  margin-top: 14px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.45);
  background: rgba(255, 255, 255, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 8.5px;
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: 0.2px;
  flex: 0 0 auto;
}

/* Motion do Jon Vlogs — webm cortado no logo, direto sobre o vermelho.
   filter deixa branco preservando a transparência (igual à logo). */
.lp-jon-motion {
  display: block;
  height: 28px;
  width: auto;
  background: transparent;
  border: none;
  object-fit: contain;
}

.lp-hero__headline {
  margin-top: 14px;
}

/* No mobile o selo do hero some (aparece no rodapé do corpo) */
.lp-hero__foot {
  display: none;
}

.lp-hero__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  text-transform: uppercase;
  font-size: 26px;
  line-height: 1;
  letter-spacing: -1px;
}

.lp-hero__subtitle {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.45;
  opacity: 0.92;
  max-width: 90%;
}

/* ===================== Corpo ===================== */
/* Mobile em 3 zonas: hero (topo) / conteúdo (centro) / selo (rodapé) */
.lp-body {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  padding: 0 18px;
}

.lp-body__inner {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 24px 0;
}

/* Barra de progresso */
.lp-progress {
  height: 3px;
  background: var(--line);
  border-radius: 99px;
  margin-bottom: 13px;
  overflow: hidden;
}

.lp-progress__fill {
  height: 100%;
  width: 0%;
  background: var(--red);
  border-radius: 99px;
  transition: width 0.32s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Label de seção */
.lp-section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--ink-faint);
  margin-bottom: 11px;
}

/* ===================== Gate (pergunta de entrada) ===================== */
.lp-gate {
  padding-top: 4px;
  animation: fadeIn 0.4s ease both;
}
.lp-gate__eyebrow {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--red);
  margin-bottom: 12px;
}
.lp-gate__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  text-transform: uppercase;
  font-size: clamp(24px, 7vw, 34px);
  line-height: 1.02;
  letter-spacing: -1px;
  color: var(--ink);
}
.lp-gate__hl { color: var(--red); }
.lp-gate__sub {
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.45;
}
.lp-gate__opts {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}
.lp-gate__opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 16px 18px;
  background: var(--white);
  border: 1.5px solid var(--line-strong);
  border-radius: 13px;
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease, background 0.16s ease;
  -webkit-tap-highlight-color: transparent;
}
.lp-gate__opt-arrow {
  font-family: var(--font-hero);
  font-style: italic;
  font-weight: 800;
  color: var(--ink-faint);
  transition: transform 0.16s ease, color 0.16s ease;
}
.lp-gate__opt:hover {
  border-color: var(--red);
  transform: translateY(-2px);
  box-shadow: 0 10px 22px -14px var(--red);
}
.lp-gate__opt:hover .lp-gate__opt-arrow {
  transform: translateX(4px);
  color: var(--red);
}
.lp-gate__opt:active { transform: translateY(0); }
/* "Sim" como opção principal (vermelha) */
.lp-gate__opt--primary {
  background: var(--red);
  border-color: var(--red);
  color: var(--white);
  box-shadow: 0 12px 24px -14px var(--red);
}
.lp-gate__opt--primary .lp-gate__opt-arrow { color: rgba(255, 255, 255, 0.8); }
.lp-gate__opt--primary:hover {
  background: var(--red-deep);
  border-color: var(--red-deep);
}
.lp-gate__opt--primary:hover .lp-gate__opt-arrow { color: var(--white); }

/* Texto introdutório (telas create / form-pós-cadastro) */
.lp-intro {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.45;
  margin-bottom: 14px;
}

.lp-intro--success {
  font-weight: 700;
  padding-left: 12px;
  border-left: 3px solid var(--red);
}

/* Botão de link discreto ("Já tenho conta") */
.lp-link-btn {
  display: block;
  width: 100%;
  margin-top: 44px;
  background: none;
  border: none;
  color: var(--ink-soft);
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}
.lp-link-btn:hover { color: var(--ink); }

/* Inputs de texto */
.lp-input {
  width: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  background: var(--white);
  border: 1.5px solid var(--line-strong);
  border-radius: 9px;
  padding: 10px 12px;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
  -webkit-appearance: none;
  appearance: none;
}
.lp-input::placeholder { color: var(--ink-faint); font-weight: 400; }
.lp-input:focus {
  outline: none;
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(253, 1, 4, 0.10);
}

/* Linha de consentimento + link dos termos */
.lp-consent {
  font-size: 11px;
  color: var(--ink-soft);
  line-height: 1.45;
  margin-top: 12px;
}
.lp-terms-link {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  color: var(--ink);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.lp-terms-link:hover { color: var(--red); }

/* Animação de erro */
.shake { animation: shake 0.35s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* Grid de perguntas (1 coluna no mobile) */
.lp-questions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 9px;
}

/* Card de pergunta */
.lp-q {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 12px;
  margin-bottom: 9px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

/* Destaque de pendência ao tentar enviar incompleto */
.lp-q.is-pending {
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(253, 1, 4, 0.10);
}

.lp-q__head {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin-bottom: 9px;
}

.lp-q__num {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: var(--red);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  font-size: 12px;
}

.lp-q__text {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
  padding-top: 3px;
}

/* Chips */
.lp-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  font-family: var(--font-body);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-soft);
  background: var(--white);
  border: 1.5px solid var(--line-strong);
  border-radius: 9px;
  padding: 7px 11px;
  cursor: pointer;
  transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}

.chip:hover {
  border-color: var(--ink-soft);
}

.chip:active {
  transform: scale(0.97);
}

.chip:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}

/* Selecionado — vermelho (padrão) */
.chip.is-selected {
  background: var(--red);
  border-color: var(--red);
  color: var(--white);
}

/* Selecionado — amarelo (ex.: "Os dois") */
.chip.is-selected.chip--yellow {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--yellow-text);
}

/* Botão CTA (serve para <button> e <a>) */
.lp-cta {
  display: block;
  width: 100%;
  margin-top: 14px;
  background: var(--red);
  color: var(--white);
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  text-transform: uppercase;
  font-size: 14px;
  letter-spacing: 0.3px;
  line-height: 1;
  text-align: center;
  text-decoration: none;
  border: none;
  padding: 13px;
  border-radius: 11px;
  box-shadow: 0 12px 24px -12px var(--red);
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.lp-cta:hover {
  box-shadow: 0 14px 28px -10px var(--red);
}

.lp-cta:active {
  transform: translateY(1px) scale(0.995);
}

.lp-cta:disabled {
  cursor: not-allowed;
}

.lp-cta.is-loading {
  opacity: 0.75;
  pointer-events: none;
}

/* CTA com motion — pulso contínuo p/ atrair o clique.
   O brilho (shine) só varre quando o cursor passa por cima. */
.lp-cta--pulse {
  position: relative;
  overflow: hidden;
  animation: ctaPulse 1.9s ease-in-out infinite;
}
/* brilho (shine) — escondido; só varre no hover */
.lp-cta--pulse::after {
  content: "";
  position: absolute;
  top: 0;
  left: -65%;
  width: 45%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  transform: skewX(-20deg);
  opacity: 0;
  pointer-events: none;
}
.lp-cta--pulse:hover::after {
  opacity: 1;
  animation: ctaShine 1s ease-out;
}
@keyframes ctaPulse {
  0%, 100% {
    box-shadow: 0 12px 24px -12px var(--red);
    transform: translateY(0) scale(1);
  }
  50% {
    box-shadow: 0 18px 36px -10px var(--red), 0 0 0 5px rgba(253, 1, 4, 0.16);
    transform: translateY(-2px) scale(1.015);
  }
}
@keyframes ctaShine {
  0% { left: -65%; }
  100% { left: 150%; }
}

/* Rodapé de responsabilidade — selo +18 + texto, fixo no fim da página */
.lp-foot {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 9.5px;
  color: var(--ink-faint);
  padding: 14px 0 18px;
  margin-top: 12px;
  border-top: 1px solid var(--line);
  line-height: 1.45;
  text-align: left;
}

/* Selo +18 — círculo (trocar por SEAL_URL oficial). "18+" centralizado. */
.lp-seal {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 9.5px;
  letter-spacing: 0;
}
.lp-seal-img {
  flex: 0 0 auto;
  height: 30px;
  width: auto;
  display: block;
}

/* ===================== Tela de confirmação ===================== */
.lp-done {
  text-align: center;
  padding: 40px 24px 48px;
  animation: fadeIn 0.4s ease both;
}

.lp-done__check {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--red);
  color: var(--white);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 16px;
}

.lp-done__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  text-transform: uppercase;
  font-size: 22px;
  letter-spacing: -0.5px;
  line-height: 1.05;
  color: var(--ink);
  margin-bottom: 10px;
}

.lp-done__text {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
  max-width: 280px;
  margin: 0 auto 20px;
}

.lp-done__badge {
  display: inline-block;
  background: var(--yellow);
  color: var(--yellow-text);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 5px 11px;
  border-radius: 99px;
  margin-bottom: 18px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===================== Modal de Termos ===================== */
.lp-modal[hidden] { display: none; }
.lp-modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lp-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(24, 16, 32, 0.55);
  backdrop-filter: blur(2px);
  animation: fadeIn 0.2s ease both;
}
.lp-modal__panel {
  position: relative;
  background: var(--white);
  border-radius: 16px;
  max-width: 460px;
  width: 100%;
  max-height: 80dvh;
  overflow-y: auto;
  padding: 24px 22px 22px;
  box-shadow: 0 24px 60px -20px rgba(24, 16, 32, 0.5);
  animation: fadeIn 0.25s ease both;
}
.lp-modal__close {
  position: absolute;
  top: 12px;
  right: 14px;
  background: none;
  border: none;
  font-size: 26px;
  line-height: 1;
  color: var(--ink-faint);
  cursor: pointer;
}
.lp-modal__close:hover { color: var(--ink); }
.lp-modal__title {
  font-family: var(--font-hero);
  font-weight: 800;
  font-style: italic;
  text-transform: uppercase;
  font-size: 18px;
  letter-spacing: -0.5px;
  color: var(--ink);
  margin-bottom: 14px;
  padding-right: 28px;
}
.lp-modal__body p {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin-bottom: 11px;
}
.lp-modal__body p:last-child { margin-bottom: 0; }

/* =====================================================
   DESKTOP / TABLET LARGO — split-screen
   ===================================================== */
@media (min-width: 880px) {
  .lp {
    flex-direction: row;
    align-items: stretch;
  }

  /* Hero vira painel esquerdo fixo, tela cheia */
  .lp-hero {
    flex: 0 0 42%;
    max-width: 560px;
    padding: 44px 56px 48px;
    display: flex;
    align-items: stretch;
    position: sticky;
    top: 0;
    height: 100dvh;
  }

  .lp-hero::after {
    width: 520px;
    height: 520px;
    right: -160px;
    top: 50%;
    transform: translateY(-50%);
  }

  .lp-hero__inner {
    max-width: 100%;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
  }

  /* logo + avatar fixos no topo */
  .lp-hero__top {
    margin-bottom: 0;
  }

  .lp-logo-wrap {
    margin-top: 0;
  }

  .lp-logo-img {
    height: 22px;
  }

  .lp-logo {
    font-size: 24px;
  }

  .lp-hero__top {
    padding-top: 0;
  }

  .lp-jon-motion {
    height: 34px;
  }

  /* headline centralizada no espaço entre o topo e a base */
  .lp-hero__headline {
    margin: auto 0;
  }

  .lp-hero__title {
    font-size: clamp(44px, 5vw, 64px);
    letter-spacing: -2px;
  }

  .lp-hero__subtitle {
    margin-top: 14px;
    font-size: 16px;
    max-width: 28ch;
  }

  /* Selo do hero (desktop): branco, fixado na base do painel vermelho */
  .lp-hero__foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 0;
    font-size: 11px;
    opacity: 0.85;
    line-height: 1.5;
    max-width: 34ch;
  }
  .lp-hero__foot .lp-seal {
    width: 32px;
    height: 32px;
    font-size: 11px;
  }
  .lp-hero__foot .lp-seal-img { height: 34px; }

  /* Corpo vira painel direito, rolável, conteúdo centralizado */
  .lp-body {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 48px;
    min-height: 100dvh;
  }

  .lp-body__inner {
    max-width: 620px;
  }

  .lp-section-label {
    font-size: 11px;
    margin-bottom: 16px;
  }

  /* Perguntas em 2 colunas no desktop */
  .lp-questions {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .lp-q {
    padding: 14px 15px;
    border-radius: 13px;
  }

  .lp-q__text {
    font-size: 14px;
  }

  .chip {
    font-size: 12.5px;
    padding: 8px 13px;
  }

  .lp-cta {
    font-size: 16px;
    padding: 16px;
    margin-top: 20px;
  }

  /* No desktop o selo aparece no hero; some do corpo */
  .lp-foot {
    display: none;
  }

  /* Confirmação ocupa as duas colunas */
  .lp-done {
    grid-column: 1 / -1;
    padding: 32px 24px;
  }
  .lp-done__title { font-size: 28px; }
  .lp-done__text { font-size: 15px; max-width: 360px; }
}

/* Telas muito largas — não deixar o hero gigante */
@media (min-width: 1500px) {
  .lp-body__inner {
    max-width: 680px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

</style>
</head>
<body>
  <main class="lp" id="lp">
    <!-- Hero (esquerda no desktop, topo no mobile) -->
    <header class="lp-hero">
      <div class="lp-hero__inner">
        <div class="lp-hero__top">
          <!-- Logo Superbet (vermelha → branca via filtro). Fallback: wordmark -->
          <span class="lp-logo-wrap">
            <img
              src="https://i.ibb.co/YBhrn1zz/Superbet-Logo-svg.png"
              alt="Superbet"
              class="lp-logo-img"
              onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';"
            />
            <span class="lp-logo" aria-label="Superbet" style="display:none">superbet<span class="lp-logo__dot">.</span></span>
          </span>
          <!-- Motion do Jon Vlogs: WebP animado (toca 1x); ao terminar, o JS
               troca pelo PNG estático limpo (fim garantido em qualquer browser).
               onerror cobre navegadores sem suporte a WebP. -->
          <img
            class="lp-jon-motion"
            src="./assets/jonvlogs-anim.webp"
            alt="Jon Vlogs"
            onerror="this.onerror=null;this.src='./assets/jonvlogs.png';"
          />
        </div>

        <div class="lp-hero__headline">
          <h1 class="lp-hero__title">SuperJon</h1>
          <p class="lp-hero__subtitle">
            Responda abaixo e garanta sua vaga no grupo do Jon Vlogs.
          </p>
        </div>

        <div class="lp-hero__foot">
          <span class="lp-seal" data-seal>18+</span>
          <span>Jogue com responsabilidade. Portaria SPA/MF Nº 2.090.</span>
        </div>
      </div>
    </header>

    <!-- Corpo (direita no desktop, abaixo no mobile) — telas renderizadas via JS -->
    <section class="lp-body">
      <div class="lp-body__inner" id="screen"></div>
      <!-- Rodapé persistente: selo +18 fixo no fim da página (mobile) -->
      <footer class="lp-foot" id="lpFoot"></footer>
    </section>
  </main>

  <!-- Modal: Termos e Condições -->
  <div class="lp-modal" id="termsModal" hidden>
    <div class="lp-modal__backdrop" data-close></div>
    <div class="lp-modal__panel" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
      <button class="lp-modal__close" type="button" data-close aria-label="Fechar">&times;</button>
      <h2 class="lp-modal__title" id="termsTitle">Termos e Condições</h2>
      <div class="lp-modal__body" id="termsBody">
        <!-- Texto preenchido via JS (placeholder até o texto jurídico final) -->
      </div>
    </div>
  </div>

  <script>
/* ===========================================================
   SuperJon — LP de conversão (Jon Vlogs × Superbet)
   Fluxo:
     gate   -> "Já tem conta na Superbet?"  (Sim / Não)
       Sim  -> form
       Não  -> create -> (abre cadastro em nova aba) -> form
     form   -> coleta dados -> submitLead -> grupo de WhatsApp
   =========================================================== */

(function () {
  'use strict';

  /* ===========================================================
     CONFIG — plugar os valores reais aqui
     =========================================================== */

  // Link de cadastro da Superbet (abre em nova aba no fluxo "Não tenho conta")
  var REGISTRATION_URL = '';            // ex.: 'https://superbet.com/...afiliado'

  // Grupo de WhatsApp (destino final do lead).
  var WHATSAPP_GROUP_URL = '';          // ex.: 'https://chat.whatsapp.com/XXXX'
  var WHATSAPP_GROUP_URL_VIP = '';      // opcional: grupo VIP (faixa 5.000+)

  // Selo +18 oficial da Superbet (imagem). Se vazio, usa placeholder estilizado.
  var SEAL_URL = '';                    // ex.: 'https://.../selo-18.png'

  // Texto do Termo de Condições exibido no modal.
  // PLACEHOLDER — substituir pelo texto jurídico oficial antes de ir ao ar.
  var TERMS_TEXT = [
    'Ao enviar seus dados nesta página, você declara ter no mínimo 18 anos e ' +
      'concorda em receber comunicações do grupo do SuperJon na Superbet pelos ' +
      'contatos informados (WhatsApp, e-mail e/ou telefone).',
    'Seus dados são tratados conforme a Lei Geral de Proteção de Dados (LGPD) e ' +
      'utilizados para qualificação, comunicação e ações de marketing relacionadas ' +
      'à Superbet. Você pode solicitar a remoção a qualquer momento.',
    'Esta página não promete prêmios, bônus ou aumento de chance de ganho como ' +
      'recompensa por cadastro ou depósito. Promoções, quando existirem, são ' +
      'comunicadas dentro do grupo e seguem regras próprias.',
    'Conteúdo destinado a maiores de 18 anos. Aposte com responsabilidade. ' +
      'Este texto é um rascunho e deve passar por revisão jurídica.'
  ];

  /* -----------------------------------------------------------
     Destino dos dados — planilha (Google Sheets via webhook).
     Recebe o payload (flat, pronto pra virar linha) e devolve Promise.
     ----------------------------------------------------------- */
  var SHEETS_WEBHOOK_URL = '';          // ex.: URL do Apps Script (doPost)

  async function submitLead(payload) {
    // Quando SHEETS_WEBHOOK_URL estiver configurado, envia pra planilha.
    // Dica: um Google Apps Script publicado como Web App (doPost) recebe o JSON
    // e dá appendRow numa planilha — simples e sem backend.
    if (SHEETS_WEBHOOK_URL) {
      return fetch(SHEETS_WEBHOOK_URL, {
        method: 'POST',
        // 'no-cors' evita bloqueio de CORS do Apps Script; resposta fica opaca.
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }
    // Sem destino configurado ainda: loga e simula sucesso.
    console.log('[submitLead] payload:', payload);
    return new Promise(function (resolve) { setTimeout(resolve, 500); });
  }

  /* ===========================================================
     Dados do formulário
     =========================================================== */

  // Campos de texto (cards numerados)
  var FIELDS = [
    { id: 'nome', label: 'Nome', type: 'text', autocomplete: 'name',
      placeholder: 'Seu nome completo' },
    { id: 'contato_superbet', label: 'E-mail ou ID Superbet', type: 'text',
      autocomplete: 'email', placeholder: 'email@exemplo.com ou seu ID' },
    { id: 'telefone', label: 'Telefone', type: 'tel', autocomplete: 'tel',
      inputmode: 'tel', placeholder: '(11) 99999-9999' }
  ];

  // Pergunta de faixa de aposta (chips) — qualifica o tier
  var BET = {
    id: 'faixa_aposta',
    label: 'Sobre quanto você aposta?',
    options: [
      { value: 'ate_1000', label: 'Até R$ 1.000' },
      { value: '1000_3000', label: 'R$ 1.000 a 3.000' },
      { value: '3000_5000', label: 'R$ 3.000 a 5.000' },
      { value: '5000_mais', label: 'R$ 5.000+', tier: 'vip' }
    ]
  };

  /* ===========================================================
     Estado
     =========================================================== */
  var state = {
    hasAccount: null,        // 'sim' | 'criou_agora'
    data: {},                // valores dos campos de texto
    bet: null                // valor da faixa
  };

  var screenEl = document.getElementById('screen');

  /* ===========================================================
     Tracking (origem / UTM)
     =========================================================== */
  function getTracking() {
    var params = new URLSearchParams(window.location.search);
    var utm = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(function (k) {
      utm[k] = params.get(k) || '';
    });
    return utm;
  }

  /* ===========================================================
     Helpers de criação de elementos
     =========================================================== */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function cardShell(num, labelText) {
    var card = el('div', 'lp-q');
    var head = el('div', 'lp-q__head');
    if (num != null) head.appendChild(el('span', 'lp-q__num', String(num)));
    head.appendChild(el('span', 'lp-q__text', labelText));
    card.appendChild(head);
    return card;
  }

  /* ===========================================================
     TELA: gate — "Já tem conta na Superbet?"
     =========================================================== */
  function renderGate() {
    screenEl.innerHTML = '';
    state.hasAccount = null;

    var gate = el('div', 'lp-gate');
    gate.appendChild(el('span', 'lp-gate__eyebrow', 'Comece por aqui'));

    var title = el('h2', 'lp-gate__title');
    title.innerHTML = 'Você já tem conta na <span class="lp-gate__hl">Superbet</span>?';
    gate.appendChild(title);

    gate.appendChild(el('p', 'lp-gate__sub',
      'Em 1 toque a gente te leva pro caminho certo.'));

    var opts = el('div', 'lp-gate__opts');
    [
      ['sim', 'Sim, já tenho', 'lp-gate__opt--primary'],
      ['nao', 'Ainda não tenho', '']
    ].forEach(function (item) {
      var btn = el('button', 'lp-gate__opt ' + item[2]);
      btn.type = 'button';
      btn.appendChild(el('span', 'lp-gate__opt-label', item[1]));
      btn.appendChild(el('span', 'lp-gate__opt-arrow', '→'));
      btn.addEventListener('click', function () {
        if (item[0] === 'sim') {
          state.hasAccount = 'sim';
          renderForm(false);
        } else {
          renderCreate();
        }
      });
      opts.appendChild(btn);
    });
    gate.appendChild(opts);

    screenEl.appendChild(gate);  }

  /* ===========================================================
     TELA: create — "Crie sua conta agora"
     =========================================================== */
  function renderCreate() {
    screenEl.innerHTML = '';

    screenEl.appendChild(el('p', 'lp-section-label', 'Quase lá'));

    var intro = el('p', 'lp-intro',
      'Pra entrar no grupo você precisa de uma conta na Superbet. ' +
      'Cria a sua agora — leva menos de 2 minutos.');
    screenEl.appendChild(intro);

    // Link real (não window.open): garante NOVA aba no PC, celular e
    // navegadores in-app (Instagram/WhatsApp), sem bloqueio de popup.
    var btn = el('a', 'lp-cta lp-cta--pulse', 'Crie sua conta agora');
    btn.href = REGISTRATION_URL || '#';
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.setAttribute('role', 'button');
    btn.addEventListener('click', function (e) {
      if (!REGISTRATION_URL) {
        e.preventDefault(); // sem link configurado: só transiciona (teste)
        console.warn('[create] REGISTRATION_URL não configurado.');
      }
      state.hasAccount = 'criou_agora';
      // Atraso pequeno: deixa a nova aba abrir (gesto do clique) ANTES de
      // trocar o conteúdo desta aba — senão remover o <a> cancelaria a abertura.
      setTimeout(function () { renderForm(true); }, 80);
    });
    screenEl.appendChild(btn);

    var back = el('button', 'lp-link-btn', 'Já tenho conta');
    back.type = 'button';
    back.addEventListener('click', function () {
      state.hasAccount = 'sim';
      renderForm(false);
    });
    screenEl.appendChild(back);
  }

  /* ===========================================================
     TELA: form — coleta de dados
     =========================================================== */
  function renderForm(fromCreate) {
    screenEl.innerHTML = '';

    // Barra de progresso
    var prog = el('div', 'lp-progress');
    prog.setAttribute('role', 'progressbar');
    prog.setAttribute('aria-valuemin', '0');
    prog.setAttribute('aria-valuemax', '100');
    var fill = el('div', 'lp-progress__fill');
    prog.appendChild(fill);
    screenEl.appendChild(prog);

    // Chamada (muda se veio do "criar conta")
    if (fromCreate) {
      var done = el('p', 'lp-intro lp-intro--success',
        'Agora que deu tudo certo com o cadastro, responde essas perguntas pra liberar o seu acesso:');
      screenEl.appendChild(done);
    } else {
      screenEl.appendChild(el('p', 'lp-section-label', 'Seus dados'));
    }

    var form = el('form', 'lp-form');
    form.noValidate = true;

    var n = 1;

    // Campos de texto
    FIELDS.forEach(function (f) {
      var card = cardShell(n++, f.label);
      var input = el('input', 'lp-input');
      input.type = f.type;
      input.name = f.id;
      input.placeholder = f.placeholder || '';
      if (f.autocomplete) input.autocomplete = f.autocomplete;
      if (f.inputmode) input.setAttribute('inputmode', f.inputmode);
      input.value = state.data[f.id] || '';
      input.addEventListener('input', function () {
        state.data[f.id] = input.value;
        card.classList.remove('is-pending');
        updateProgress(fill, prog);
      });
      card.appendChild(input);
      card.dataset.field = f.id;
      form.appendChild(card);
    });

    // Faixa de aposta (chips)
    var betCard = cardShell(n++, BET.label);
    betCard.dataset.field = BET.id;
    var chips = el('div', 'lp-chips');
    BET.options.forEach(function (opt) {
      var chip = el('button', 'chip', opt.label);
      chip.type = 'button';
      if (state.bet === opt.value) chip.classList.add('is-selected');
      chip.addEventListener('click', function () {
        state.bet = opt.value;
        chips.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-selected'); });
        chip.classList.add('is-selected');
        betCard.classList.remove('is-pending');
        updateProgress(fill, prog);
      });
      chips.appendChild(chip);
    });
    betCard.appendChild(chips);
    form.appendChild(betCard);

    // Consentimento
    var consent = el('p', 'lp-consent');
    consent.appendChild(document.createTextNode('Ao enviar, você concorda com os '));
    var termsLink = el('button', 'lp-terms-link', 'Termos e Condições');
    termsLink.type = 'button';
    termsLink.addEventListener('click', openTerms);
    consent.appendChild(termsLink);
    consent.appendChild(document.createTextNode('.'));
    form.appendChild(consent);

    // CTA
    var cta = el('button', 'lp-cta', 'Quero entrar no grupo agora');
    cta.type = 'submit';
    form.appendChild(cta);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      handleSubmit(cta);
    });

    screenEl.appendChild(form);    updateProgress(fill, prog);
  }

  /* ===========================================================
     Validação / progresso
     =========================================================== */
  function fieldFilled(id) {
    if (id === BET.id) return state.bet != null;
    return (state.data[id] || '').trim().length > 0;
  }

  function requiredIds() {
    return FIELDS.map(function (f) { return f.id; }).concat([BET.id]);
  }

  function updateProgress(fill, prog) {
    var ids = requiredIds();
    var done = ids.filter(fieldFilled).length;
    var pct = Math.round((done / ids.length) * 100);
    fill.style.width = pct + '%';
    if (prog) prog.setAttribute('aria-valuenow', String(pct));
  }

  function validateField(id) {
    var v = (state.data[id] || '').trim();
    if (id === BET.id) return state.bet != null;
    if (!v) return false;
    if (id === 'contato_superbet') {
      // e-mail OU id: aceita e-mail válido ou texto com >= 3 chars (ID)
      var isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      return isEmail || v.length >= 3;
    }
    if (id === 'telefone') {
      var digits = v.replace(/\D/g, '');
      return digits.length >= 10;
    }
    return v.length >= 2; // nome
  }

  function highlightInvalid() {
    var first = null;
    requiredIds().forEach(function (id) {
      var card = screenEl.querySelector('[data-field="' + id + '"]');
      if (!card) return;
      if (!validateField(id)) {
        card.classList.add('is-pending');
        if (!first) first = card;
      } else {
        card.classList.remove('is-pending');
      }
    });
    if (first) {
      first.classList.add('shake');
      setTimeout(function () { first.classList.remove('shake'); }, 400);
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var inp = first.querySelector('input');
      if (inp) inp.focus({ preventScroll: true });
    }
  }

  /* ===========================================================
     Payload (flat, pronto pra virar linha de planilha)
     =========================================================== */
  function betLabel(value) {
    var o = BET.options.filter(function (x) { return x.value === value; })[0];
    return o ? o.label : '';
  }

  function tierOf(value) {
    var o = BET.options.filter(function (x) { return x.value === value; })[0];
    return o && o.tier === 'vip' ? 'vip' : 'standard';
  }

  function buildPayload() {
    var utm = getTracking();
    var tier = tierOf(state.bet);
    return {
      // dados do lead
      nome: (state.data.nome || '').trim(),
      contato_superbet: (state.data.contato_superbet || '').trim(),
      telefone: (state.data.telefone || '').trim(),
      faixa_aposta: state.bet,
      faixa_aposta_label: betLabel(state.bet),
      // qualificação
      ja_tinha_conta: state.hasAccount === 'sim' ? 'sim' : 'criou_agora',
      tier: tier,
      vip_candidate: tier === 'vip',
      // consentimento
      consentimento: true,
      consentimento_texto: 'Ao enviar, você concorda com os Termos e Condições.',
      // origem
      origem: 'lp_superjon',
      utm_source: utm.utm_source,
      utm_medium: utm.utm_medium,
      utm_campaign: utm.utm_campaign,
      utm_content: utm.utm_content,
      utm_term: utm.utm_term,
      referrer: document.referrer || '',
      landing_url: window.location.href,
      user_agent: navigator.userAgent,
      submitted_at: new Date().toISOString()
    };
  }

  /* ===========================================================
     Submit
     =========================================================== */
  function handleSubmit(cta) {
    var ok = requiredIds().every(validateField);
    if (!ok) {
      highlightInvalid();
      return;
    }

    var payload = buildPayload();

    cta.classList.add('is-loading');
    cta.disabled = true;
    var original = cta.textContent;
    cta.textContent = 'Enviando...';

    submitLead(payload)
      .then(function () { goToGroup(payload); })
      .catch(function (err) {
        console.error('[submitLead] erro:', err);
        cta.classList.remove('is-loading');
        cta.disabled = false;
        cta.textContent = 'Tentar de novo';
      });
  }

  function goToGroup(payload) {
    var url = (payload.tier === 'vip' && WHATSAPP_GROUP_URL_VIP)
      ? WHATSAPP_GROUP_URL_VIP
      : WHATSAPP_GROUP_URL;

    if (url) {
      window.location.href = url;
      return;
    }
    renderDone(payload);
  }

  /* ===========================================================
     TELA: done (fallback se não houver link de grupo)
     =========================================================== */
  function renderDone(payload) {
    screenEl.innerHTML = '';
    var box = el('div', 'lp-done');
    box.appendChild(el('div', 'lp-done__check', '✓'));
    if (payload.vip_candidate) {
      box.appendChild(el('div', 'lp-done__badge', 'Fila VIP'));
    }
    box.appendChild(el('h2', 'lp-done__title', 'Tudo certo!'));
    box.appendChild(el('p', 'lp-done__text',
      'Recebemos seus dados. Em instantes você entra no grupo do SuperJon. ' +
      'Fica de olho no WhatsApp informado.'));
    screenEl.appendChild(box);  }

  /* ===========================================================
     Rodapé + selo +18
     =========================================================== */
  // Rodapé persistente (selo +18), renderizado uma vez no fim da página.
  function renderFooter() {
    var foot = document.getElementById('lpFoot');
    if (!foot) return;
    foot.innerHTML = '';
    foot.appendChild(buildSeal());
    foot.appendChild(el('span', null,
      'Jogue com responsabilidade. Portaria SPA/MF Nº 2.090.'));
  }

  // Selo +18 — círculo simples. Se SEAL_URL for definido, usa a imagem oficial.
  function buildSeal() {
    if (SEAL_URL) {
      var img = el('img', 'lp-seal-img');
      img.src = SEAL_URL;
      img.alt = '18+ Jogue com responsabilidade';
      return img;
    }
    return el('span', 'lp-seal', '18+');
  }

  // Pinta o selo do rodapé do hero (desktop)
  function paintHeroSeal() {
    document.querySelectorAll('[data-seal]').forEach(function (node) {
      node.replaceWith(buildSeal());
    });
  }

  /* ===========================================================
     Modal de Termos
     =========================================================== */
  var modal = document.getElementById('termsModal');
  var termsBody = document.getElementById('termsBody');

  function openTerms() {
    termsBody.innerHTML = '';
    TERMS_TEXT.forEach(function (p) { termsBody.appendChild(el('p', null, p)); });
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeTerms() {
    modal.hidden = true;
    document.body.style.overflow = '';
  }

  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeTerms();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeTerms();
  });

  /* ===========================================================
     Init
     =========================================================== */
  /* ===========================================================
     Motion do Jon Vlogs — toca 1x e congela na imagem estática limpa.
     (alguns browsers voltam o WebP ao 1º frame ao fim do loop; trocar
      pelo PNG garante um fim bom em qualquer dispositivo)
     =========================================================== */
  (function settleMotion() {
    var img = document.querySelector('img.lp-jon-motion');
    if (!img) return;
    var STATIC = './assets/jonvlogs.png';
    // A revelação termina ~1,5s e segura o logo até ~2,1s. Trocamos pelo PNG
    // durante esse hold (1,7s) -> parada natural, sem flash de reset do WebP.
    var DURATION = 1700;
    var pre = new Image();
    pre.src = STATIC; // pré-carrega p/ troca instantânea
    setTimeout(function () {
      if (img.src.indexOf('jonvlogs.png') === -1) img.src = STATIC;
    }, DURATION);
  })();

  paintHeroSeal();
  renderFooter();
  renderGate();
})();

</script>
</body>
</html>
