<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FD0104" />
  <title>LP</title>
  <meta name="description" content="" />

  <!-- Favicon (brand-specific). =s256-c entrega ícone quadrado recortado. -->
  <link rel="icon" type="image/png"
        href="https://play-lh.googleusercontent.com/Q6uqNf1b4k7h4peN2r7jX1ok-Ur5l28cjm9qUb02Te2fyvo7iQRI09ReCZOQM26FSw=s256-c" />
  <link rel="apple-touch-icon"
        href="https://play-lh.googleusercontent.com/Q6uqNf1b4k7h4peN2r7jX1ok-Ur5l28cjm9qUb02Te2fyvo7iQRI09ReCZOQM26FSw=s180-c" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Logos críticas: preconnect + preload p/ baixarem já no parse (antes do JS).
       Brand-specific: ao replicar, troque pelas URLs/assets da nova marca. -->
  <link rel="preconnect" href="https://i.ibb.co" crossorigin />
  <link rel="preload" as="image" fetchpriority="high"
        href="https://i.ibb.co/YBhrn1zz/Superbet-Logo-svg.png" />
  <link rel="preload" as="image" fetchpriority="high"
        href="./brands/superjon/assets/jonvlogs.png" />
  <!-- Fontes carregadas de forma NÃO-bloqueante (não trava render nem scripts) -->
  <link
    rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:ital,opsz,wght@0,8..144,400..900;1,8..144,600..900&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Flex:ital,opsz,wght@0,8..144,400..900;1,8..144,600..900&display=swap" />
  </noscript>

  <link rel="stylesheet" href="./engine/engine.css" />
</head>
<body>
  <main class="lp" id="lp">
    <!-- Hero (preenchido pelo engine a partir da config da marca) -->
    <header class="lp-hero">
      <div class="lp-hero__inner">
        <div class="lp-hero__top">
          <span class="lp-logo-wrap">
            <img class="lp-logo-img" alt="" fetchpriority="high" decoding="async" />
            <span class="lp-logo" style="display:none"></span>
          </span>
          <img class="lp-jon-motion" alt="" fetchpriority="high" decoding="async" />
        </div>
        <div class="lp-hero__headline">
          <h1 class="lp-hero__title"></h1>
          <p class="lp-hero__subtitle"></p>
        </div>

        <!-- Selo +18 no rodapé do hero (visível no desktop) -->
        <div class="lp-hero__foot">
          <span data-seal></span>
          <span class="lp-hero__foot-text"></span>
        </div>
      </div>
    </header>

    <!-- Corpo: telas renderizadas pelo engine + rodapé persistente -->
    <section class="lp-body">
      <div class="lp-body__inner" id="screen"></div>
      <footer class="lp-foot" id="lpFoot"></footer>
    </section>
  </main>

  <!-- Modal: Termos e Condições -->
  <div class="lp-modal" id="termsModal" hidden>
    <div class="lp-modal__backdrop" data-close></div>
    <div class="lp-modal__panel" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
      <button class="lp-modal__close" type="button" data-close aria-label="Fechar">&times;</button>
      <h2 class="lp-modal__title" id="termsTitle">Termos e Condições</h2>
      <div class="lp-modal__body" id="termsBody"></div>
    </div>
  </div>

  <!-- Config da marca primeiro, depois o engine -->
  <script src="./brands/superjon/config.js"></script>
  <script src="./engine/engine.js" defer></script>
</body>
</html>
