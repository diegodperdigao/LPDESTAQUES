<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!--BRAND_HEAD-->

  <link rel="stylesheet" href="./engine/engine.css" />
  <!--BRAND_STYLE-->
</head>
<body>
  <main class="lp" id="lp">
    <!-- Hero (preenchido pelo engine a partir da config da marca) -->
    <header class="lp-hero">
      <!-- Influenciador: PREENCHE o painel (cover). Filhos diretos do hero p/
           o inset:0 cobrir o painel inteiro. Foto = desktop, banner = mobile. -->
      <img class="lp-hero__photo" alt="" fetchpriority="high" decoding="async" />
      <img class="lp-hero__banner" alt="" fetchpriority="high" decoding="async" />
      <div class="lp-hero__scrim" aria-hidden="true"></div>
      <div class="lp-hero__inner">
        <div class="lp-hero__top">
          <span class="lp-logo-wrap">
            <img class="lp-logo-img" alt="" fetchpriority="high" decoding="async" />
            <span class="lp-logo" style="display:none"></span>
          </span>
          <img class="lp-jon-motion" alt="" fetchpriority="high" decoding="async" />
        </div>
        <!-- Selo +18 (por cima da imagem no desktop) -->
        <div class="lp-hero__foot">
          <span data-seal></span>
          <span class="lp-hero__foot-text"></span>
        </div>
      </div>
    </header>

    <!-- Corpo: telas renderizadas pelo engine + rodapé persistente -->
    <section class="lp-body">
      <div class="lp-body__inner" id="screen"></div>
      <footer class="lp-foot" id="lpFoot"></footer>
    </section>
  </main>

  <!-- Aviso obrigatório (Lei das Bets) — barra fixa no rodapé. Texto vem da config (B.legal). -->
  <aside class="lp-legal" id="lpLegal" aria-label="Aviso obrigatório">
    <span class="lp-legal__18">18+</span>
    <p class="lp-legal__msg"></p>
    <span class="lp-legal__extra"></span>
  </aside>

  <!-- Modal: Termos e Condições -->
  <div class="lp-modal" id="termsModal" hidden>
    <div class="lp-modal__backdrop" data-close></div>
    <div class="lp-modal__panel" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
      <button class="lp-modal__close" type="button" data-close aria-label="Fechar">&times;</button>
      <h2 class="lp-modal__title" id="termsTitle">Termos e Condições</h2>
      <div class="lp-modal__body" id="termsBody"></div>
    </div>
  </div>

  <!-- Pop-up: cadastro (fluxo direto — "Não possui cadastro?") -->
  <div class="lp-modal" id="regModal" hidden>
    <div class="lp-modal__backdrop" data-close></div>
    <div class="lp-modal__panel lp-modal__panel--reg" role="dialog" aria-modal="true" aria-labelledby="regTitle">
      <button class="lp-modal__close" type="button" data-close aria-label="Fechar">&times;</button>
      <h2 class="lp-modal__title" id="regTitle"></h2>
      <p class="lp-modal__lead" id="regText"></p>
      <a class="lp-cta lp-cta--pulse" id="regCta" target="_blank" rel="noopener noreferrer" role="button"></a>
    </div>
  </div>

  <!--BRAND_CONFIG-->
  <script src="./engine/engine.js" defer></script>
</body>
</html>
